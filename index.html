
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Johannes | Ambient TV</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

/* =====================================
   GENERAL
===================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
    font-family: Arial, sans-serif;
}

/* =====================================
   BACKGROUND PHOTOS
===================================== */

.slide {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    opacity: 0;
    transition: opacity 2s ease;
}

.slide.active {
    opacity: 1;
}

/* =====================================
   WEATHER
===================================== */

#weatherLayer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    z-index: 3;

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 2.5s ease,
        visibility 2.5s;
}

#weatherLayer.visible {
    opacity: 1;
    visibility: visible;
}

#overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: rgba(0,0,0,0.18);
    transition: background 3s ease;
}

#sunGlow {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: radial-gradient(
        circle at 80% 0%,
        rgba(255,195,75,0.35),
        transparent 65%
    );

    opacity: 0;
    transition: opacity 3s ease;
}

#fog {
    position: absolute;
    top: -20%;
    left: -20%;

    width: 140%;
    height: 140%;

    background: radial-gradient(
        ellipse,
        rgba(205,215,225,0.30),
        transparent 75%
    );

    opacity: 0;
    transition: opacity 3s ease;

    animation: fogMove 20s ease-in-out infinite alternate;
}

@keyframes fogMove {
    from {
        transform: translateX(-8%);
    }

    to {
        transform: translateX(8%);
    }
}

#weatherCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
}

#lightning {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;

    background: white;
    opacity: 0;

    pointer-events: none;
}

/* =====================================
   GREETING
===================================== */

#greetingScreen {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    z-index: 30;

    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;
    pointer-events: none;
}

#greetingText {
    padding: 0 25px;

    color: white;

    font-family: 'Great Vibes', cursive;
    font-size: clamp(65px,10vw,155px);
    font-weight: normal;
    line-height: 1.4;

    text-shadow: 0 5px 30px rgba(0,0,0,0.95);

    opacity: 0;
    transform: translateY(15px);

    transition:
        opacity 2s ease,
        transform 2s ease;
}

#greetingText.show {
    opacity: 1;
    transform: translateY(0);
}

/* =====================================
   MAIN INTERFACE
===================================== */

#mainInterface {
    position: absolute;
    top: 0;
    left: 0;

    width: 100%;
    height: 100%;

    z-index: 20;

    opacity: 0;
    visibility: hidden;

    pointer-events: none;

    transition:
        opacity 2.5s ease,
        visibility 2.5s;
}

#mainInterface.visible {
    opacity: 1;
    visibility: visible;
}

#clockContainer {
    position: absolute;
    top: 50%;
    left: 50%;

    transform: translate(-50%,-50%);

    width: 95%;

    text-align: center;
    color: white;

    text-shadow: 0 4px 25px rgba(0,0,0,0.9);
}

#fancyClock {
    font-family: 'Great Vibes', cursive;

    font-size: clamp(95px,15vw,220px);
    font-weight: normal;
    line-height: 1.3;
}

.clockDivider {
    width: 100px;
    height: 1px;

    margin: 0 auto 25px;

    background: rgba(255,255,255,0.8);
}

#currentDate {
    font-family: 'Montserrat', Arial, sans-serif;

    font-size: clamp(15px,2vw,27px);
    font-weight: 300;

    letter-spacing: 4px;
    text-transform: uppercase;
}

#weatherInfo {
    margin-top: 25px;

    font-family: 'Montserrat', Arial, sans-serif;

    font-size: clamp(13px,1.3vw,19px);
    font-weight: 300;

    letter-spacing: 3px;
}

#bottomLabel {
    position: absolute;
    bottom: 25px;

    width: 100%;

    text-align: center;
    color: rgba(255,255,255,0.65);

    font-family: 'Montserrat', Arial, sans-serif;

    font-size: 11px;
    letter-spacing: 5px;
}

#errorMessage {
    position: absolute;
    top: 12px;
    left: 12px;

    z-index: 100;

    color: #ffaaaa;
    font: 13px monospace;

    pointer-events: none;
}

</style>

</head>

<body>

<!-- BACKGROUND PHOTOS -->

<div id="slide1" class="slide active"></div>
<div id="slide2" class="slide"></div>

<!-- WEATHER LAYER -->

<div id="weatherLayer">

    <div id="overlay"></div>
    <div id="sunGlow"></div>
    <div id="fog"></div>

    <canvas id="weatherCanvas"></canvas>

    <div id="lightning"></div>

</div>

<!-- WELCOME SCREEN -->

<div id="greetingScreen">
    <div id="greetingText"></div>
</div>

<!-- CLOCK / DATE / WEATHER INFO -->

<div id="mainInterface">

    <div id="clockContainer">

        <div id="fancyClock">00:00</div>

        <div class="clockDivider"></div>

        <div id="currentDate">Loading...</div>

        <div id="weatherInfo">VALLENTUNA</div>

    </div>

    <div id="bottomLabel">HOME</div>

</div>

<div id="errorMessage"></div>


<!-- =====================================
     CLOCK SCRIPT
===================================== -->

<script>

window.onerror = function(message, source, line) {

    document.getElementById("errorMessage").textContent =
        "ERROR LINE " + line + ": " + message;

    return false;
};

function updateClock() {

    var now = new Date();

    var hours = ("0" + now.getHours()).slice(-2);
    var minutes = ("0" + now.getMinutes()).slice(-2);

    var days = [
        "Sunday", "Monday", "Tuesday",
        "Wednesday", "Thursday", "Friday",
        "Saturday"
    ];

    var months = [
        "January", "February", "March",
        "April", "May", "June",
        "July", "August", "September",
        "October", "November", "December"
    ];

    document.getElementById("fancyClock").textContent =
        hours + ":" + minutes;

    document.getElementById("currentDate").textContent =
        days[now.getDay()] + ", " +
        now.getDate() + " " +
        months[now.getMonth()] + " " +
        now.getFullYear();
}

updateClock();

setInterval(updateClock,1000);

</script>


<!-- =====================================
     MAIN SCRIPT
===================================== -->

<script>

/* =====================================
   SETTINGS
===================================== */

var photos = [
    "photos/photo1.jpg",
    "photos/photo2.jpg",
    "photos/photo3.jpg"
];

var slideDuration = 15000;

var shuffle = false;


/* VALLENTUNA WEATHER */

var LATITUDE = 59.5344;
var LONGITUDE = 18.0776;

var weatherRefresh = 600000;


/* WEATHER TEST MODE */

var TEST_MODE = false;
var TEST_WEATHER = "storm";


/* SOUND SETTINGS */

var enableWeatherSounds = true;

var weatherVolume = 0.35;
var thunderVolume = 0.70;

/*
   Sound starts logically ON.

   First click = OFF
   Second click = ON
*/

var soundEnabled = true;


/* GREETING SETTINGS */

var greetingFadeInDelay = 700;
var greetingVisibleDuration = 4000;
var greetingFadeOutDuration = 2000;
var mainFadeDelay = 500;


/* TV WAKE DETECTOR */

var wakeThreshold = 60000;


/* =====================================
   SLIDESHOW
===================================== */

var photoIndex = 0;
var activeSlide = 0;

var slides = [
    document.getElementById("slide1"),
    document.getElementById("slide2")
];

if (shuffle) {

    photos.sort(function() {
        return Math.random() - 0.5;
    });

}

if (photos.length > 0) {

    slides[0].style.backgroundImage =
        'url("' + photos[0] + '")';

}

function nextPhoto() {

    if (photos.length < 2) return;

    var nextIndex =
        (photoIndex + 1) % photos.length;

    var nextSlide =
        1 - activeSlide;

    var image = new Image();

    image.onload = function() {

        slides[nextSlide].style.backgroundImage =
            'url("' + photos[nextIndex] + '")';

        slides[nextSlide].classList.add("active");

        slides[activeSlide].classList.remove("active");

        activeSlide = nextSlide;
        photoIndex = nextIndex;

    };

    image.onerror = function() {
        photoIndex = nextIndex;
    };

    image.src = photos[nextIndex];
}

if (photos.length > 1) {

    setInterval(nextPhoto,slideDuration);

}


/* =====================================
   GREETING
===================================== */

var greetingFinished = false;

var greetingTimers = [];

function getGreeting() {

    var hour = new Date().getHours();

    if (hour >= 5 && hour < 12) {
        return "Goodmorning Johannes";
    }

    if (hour >= 12 && hour < 18) {
        return "Good afternoon Johannes";
    }

    return "Good evening Johannes";
}

function startGreeting() {

    for (var i = 0; i < greetingTimers.length; i++) {
        clearTimeout(greetingTimers[i]);
    }

    greetingTimers = [];

    var greetingScreen =
        document.getElementById("greetingScreen");

    var greeting =
        document.getElementById("greetingText");

    var weatherLayer =
        document.getElementById("weatherLayer");

    var mainInterface =
        document.getElementById("mainInterface");

    greetingFinished = false;

    weatherLayer.classList.remove("visible");
    mainInterface.classList.remove("visible");

    clearTimeout(lightningTimer);

    document.getElementById("lightning").style.opacity = "0";

    greetingScreen.style.display = "flex";

    greeting.classList.remove("show");

    greeting.textContent = getGreeting();

    /* FADE IN */

    greetingTimers.push(

        setTimeout(function() {

            greeting.classList.add("show");

        },greetingFadeInDelay)

    );

    /* FADE OUT */

    greetingTimers.push(

        setTimeout(function() {

            greeting.classList.remove("show");

        },greetingFadeInDelay + greetingVisibleDuration)

    );

    /* REVEAL MAIN GALLERY */

    greetingTimers.push(

        setTimeout(function() {

            greetingFinished = true;

            greetingScreen.style.display = "none";

            weatherLayer.classList.add("visible");

            mainInterface.classList.add("visible");

            createParticles();

            startLightning();

            updateWeatherAudio(currentWeather);

        },
        greetingFadeInDelay +
        greetingVisibleDuration +
        greetingFadeOutDuration +
        mainFadeDelay)

    );

}


/* =====================================
   WEATHER PRESETS
===================================== */

var weatherSettings = {

    clear: {
        count: 0,
        darkness: 0.18,
        speed: 0,
        label: "CLEAR SKY"
    },

    sunny: {
        count: 25,
        darkness: 0.08,
        speed: 0.3,
        label: "SUNNY"
    },

    cloudy: {
        count: 0,
        darkness: 0.32,
        speed: 0,
        label: "CLOUDY"
    },

    fog: {
        count: 0,
        darkness: 0.28,
        speed: 0,
        label: "FOGGY"
    },

    drizzle: {
        count: 40,
        darkness: 0.30,
        speed: 3,
        label: "LIGHT RAIN"
    },

    rain: {
        count: 70,
        darkness: 0.35,
        speed: 7,
        label: "RAINING"
    },

    heavy_rain: {
        count: 120,
        darkness: 0.48,
        speed: 15,
        label: "HEAVY RAIN"
    },

    storm: {
        count: 180,
        darkness: 0.65,
        speed: 21,
        label: "THUNDERSTORM"
    },

    snow: {
        count: 70,
        darkness: 0.22,
        speed: 1.4,
        label: "SNOWING"
    },

    blizzard: {
        count: 100,
        darkness: 0.40,
        speed: 6,
        label: "SNOWSTORM"
    }

};


/* =====================================
   WEATHER ENGINE
===================================== */

var canvas =
    document.getElementById("weatherCanvas");

var ctx =
    canvas.getContext("2d");

var width = 0;
var height = 0;

var particles = [];

var currentWeather = "clear";

var lightningTimer = null;

var weatherInfo =
    document.getElementById("weatherInfo");


function createParticle(randomY) {

    var snow =
        currentWeather === "snow" ||
        currentWeather === "blizzard";

    var sunny =
        currentWeather === "sunny";

    return {

        x: Math.random() * width,

        y: randomY
            ? Math.random() * height
            : -30,

        size: snow
            ? 1.5 + Math.random() * 4
            : sunny
                ? 1 + Math.random() * 2
                : 0.5 + Math.random() * 1.4,

        length: 10 + Math.random() * 24,

        speed: 0.6 + Math.random() * 0.8,

        drift: (Math.random() - 0.5) * 1.5,

        opacity: 0.25 + Math.random() * 0.5,

        phase: Math.random() * Math.PI * 2

    };
}


function createParticles() {

    particles = [];

    if (!greetingFinished) return;

    var settings =
        weatherSettings[currentWeather];

    for (var i = 0; i < settings.count; i++) {

        particles.push(createParticle(true));

    }
}


function resizeCanvas() {

    width = window.innerWidth;
    height = window.innerHeight;

    canvas.width = width;
    canvas.height = height;

    createParticles();
}

window.addEventListener("resize",resizeCanvas);


/* =====================================
   SET WEATHER
===================================== */

function setWeather(type,temperature) {

    if (!weatherSettings[type]) {
        type = "clear";
    }

    currentWeather = type;

    var settings =
        weatherSettings[type];

    document.getElementById("overlay").style.background =
        "rgba(0,0,0," + settings.darkness + ")";

    document.getElementById("sunGlow").style.opacity =
        type === "sunny" ? "1" : "0";

    document.getElementById("fog").style.opacity =
        type === "fog" ? "1" : "0";

    var label = settings.label;

    if (typeof temperature === "number") {

        label +=
            "  ·  " +
            Math.round(temperature) +
            "°C";

    }

    weatherInfo.textContent =
        label + "  ·  VALLENTUNA";

    if (greetingFinished) {

        createParticles();

        startLightning();

        updateWeatherAudio(type);

    }
}


/* =====================================
   WEATHER ANIMATION
===================================== */

function animateWeather() {

    ctx.clearRect(0,0,width,height);

    if (!greetingFinished || galleryInBackground) {

        requestAnimationFrame(animateWeather);

        return;
    }

    var settings =
        weatherSettings[currentWeather];

    var snow =
        currentWeather === "snow" ||
        currentWeather === "blizzard";

    var sunny =
        currentWeather === "sunny";

    var storm =
        currentWeather === "storm";

    for (var i = 0; i < particles.length; i++) {

        var p = particles[i];

        ctx.beginPath();

        if (snow) {

            ctx.fillStyle =
                "rgba(255,255,255," + p.opacity + ")";

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

            p.y += settings.speed * p.speed;

            p.x +=
                p.drift +
                Math.sin(
                    p.y * 0.01 + p.phase
                ) * 0.5;

            if (currentWeather === "blizzard") {
                p.x += 3;
            }

        } else if (sunny) {

            ctx.fillStyle =
                "rgba(255,220,150," +
                (p.opacity * 0.5) +
                ")";

            ctx.arc(
                p.x,
                p.y,
                p.size,
                0,
                Math.PI * 2
            );

            ctx.fill();

            p.y -= 0.3;

            p.x += Math.sin(
                p.y * 0.01 + p.phase
            ) * 0.4;

        } else {

            ctx.strokeStyle =
                "rgba(205,225,255," +
                p.opacity +
                ")";

            ctx.lineWidth = p.size;

            var wind =
                storm ? -0.7 : -0.25;

            ctx.moveTo(p.x,p.y);

            ctx.lineTo(
                p.x + p.length * wind,
                p.y + p.length
            );

            ctx.stroke();

            p.y +=
                settings.speed * p.speed;

            p.x +=
                settings.speed *
                wind *
                0.35;

        }

        if (
            p.y > height + 40 ||
            p.x < -60 ||
            p.x > width + 60 ||
            (sunny && p.y < -40)
        ) {

            particles[i] =
                createParticle(false);

            if (sunny) {

                particles[i].y =
                    height + 10;

            }

            if (currentWeather === "blizzard") {

                particles[i].x = -20;

                particles[i].y =
                    Math.random() * height;

            }
        }
    }

    requestAnimationFrame(animateWeather);
}


/* =====================================
   LIGHTNING
===================================== */

function lightningFlash() {

    if (
        !greetingFinished ||
        galleryInBackground ||
        currentWeather !== "storm"
    ) {
        return;
    }

    var element =
        document.getElementById("lightning");

    element.style.opacity = "0.65";

    playThunder();

    setTimeout(function() {

        element.style.opacity = "0";

    },90);

    if (Math.random() > 0.45) {

        setTimeout(function() {

            if (
                currentWeather !== "storm" ||
                galleryInBackground
            ) {
                return;
            }

            element.style.opacity = "0.9";

            setTimeout(function() {

                element.style.opacity = "0";

            },110);

        },180);
    }
}


function scheduleLightning() {

    if (
        !greetingFinished ||
        galleryInBackground ||
        currentWeather !== "storm"
    ) {
        return;
    }

    lightningFlash();

    lightningTimer = setTimeout(
        scheduleLightning,
        3500 + Math.random() * 9000
    );
}


function startLightning() {

    clearTimeout(lightningTimer);

    document.getElementById("lightning").style.opacity = "0";

    if (
        greetingFinished &&
        !galleryInBackground &&
        currentWeather === "storm"
    ) {

        lightningTimer = setTimeout(
            scheduleLightning,
            2000 + Math.random() * 4000
        );

    }
}


/* =====================================
   WEATHER AUDIO
===================================== */

var audioContext = null;

var masterGain = null;
var rainGain = null;
var windGain = null;

var noiseBuffer = null;

var audioReady = false;

var galleryInBackground = false;


function createNoiseBuffer(context) {

    var length =
        context.sampleRate * 4;

    var buffer =
        context.createBuffer(
            1,
            length,
            context.sampleRate
        );

    var data =
        buffer.getChannelData(0);

    for (var i = 0; i < length; i++) {

        data[i] =
            Math.random() * 2 - 1;

    }

    return buffer;
}


/* =====================================
   INITIALISE AUDIO
===================================== */

function initializeWeatherAudio() {

    if (
        !enableWeatherSounds ||
        !soundEnabled ||
        galleryInBackground
    ) {
        return;
    }

    if (audioReady) {

        resumeGalleryAudio();

        return;
    }

    var AudioClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if (!AudioClass) return;

    try {

        audioContext =
            new AudioClass();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value =
            weatherVolume;

        masterGain.connect(
            audioContext.destination
        );

        noiseBuffer =
            createNoiseBuffer(audioContext);

        /* RAIN */

        var rainSource =
            audioContext.createBufferSource();

        rainSource.buffer =
            noiseBuffer;

        rainSource.loop = true;

        var rainFilter =
            audioContext.createBiquadFilter();

        rainFilter.type = "lowpass";

        rainFilter.frequency.value =
            2400;

        rainGain =
            audioContext.createGain();

        rainGain.gain.value = 0;

        rainSource.connect(rainFilter);

        rainFilter.connect(rainGain);

        rainGain.connect(masterGain);

        rainSource.start(0);

        /* WIND */

        var windSource =
            audioContext.createBufferSource();

        windSource.buffer =
            noiseBuffer;

        windSource.loop = true;

        var windFilter =
            audioContext.createBiquadFilter();

        windFilter.type = "lowpass";

        windFilter.frequency.value =
            350;

        windGain =
            audioContext.createGain();

        windGain.gain.value = 0;

        windSource.connect(windFilter);

        windFilter.connect(windGain);

        windGain.connect(masterGain);

        windSource.start(0);

        audioReady = true;

        updateWeatherAudio(currentWeather);

        if (
            audioContext.state === "suspended"
        ) {
            audioContext.resume();
        }

    } catch(error) {

        audioReady = false;

    }
}


/* =====================================
   UPDATE WEATHER AUDIO
===================================== */

function updateWeatherAudio(type) {

    if (!audioReady) return;

    var rain = 0;
    var wind = 0;

    if (
        greetingFinished &&
        !galleryInBackground &&
        soundEnabled
    ) {

        switch(type) {

            case "drizzle":
                rain = 0.12;
                break;

            case "rain":
                rain = 0.35;
                wind = 0.05;
                break;

            case "heavy_rain":
                rain = 0.7;
                wind = 0.15;
                break;

            case "storm":
                rain = 0.9;
                wind = 0.4;
                break;

            case "snow":
                wind = 0.07;
                break;

            case "blizzard":
                wind = 0.75;
                break;

            case "fog":
                wind = 0.04;
                break;

        }
    }

    var now =
        audioContext.currentTime;

    rainGain.gain.setTargetAtTime(
        rain,
        now,
        2
    );

    windGain.gain.setTargetAtTime(
        wind,
        now,
        2
    );
}


/* =====================================
   THUNDER
===================================== */

function playThunder() {

    if (
        !audioReady ||
        !soundEnabled ||
        !greetingFinished ||
        galleryInBackground
    ) {
        return;
    }

    var source =
        audioContext.createBufferSource();

    source.buffer =
        noiseBuffer;

    var filter =
        audioContext.createBiquadFilter();

    filter.type = "lowpass";

    filter.frequency.value = 130;

    var gain =
        audioContext.createGain();

    var now =
        audioContext.currentTime;

    gain.gain.setValueAtTime(
        0.001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        thunderVolume,
        now + 0.15
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 3.5
    );

    source.connect(filter);

    filter.connect(gain);

    gain.connect(masterGain);

    source.start(now);

    source.stop(now + 3.6);
}


/* =====================================
   AUDIO CONTROL
===================================== */

function applySoundSetting() {

    if (!audioReady || !audioContext) {
        return;
    }

    try {

        var now =
            audioContext.currentTime;

        masterGain.gain.cancelScheduledValues(now);

        var volume = (
            soundEnabled &&
            !galleryInBackground
        )
            ? weatherVolume
            : 0;

        masterGain.gain.setValueAtTime(
            volume,
            now
        );

        updateWeatherAudio(currentWeather);

    } catch(error) {}
}


/* =====================================
   BACKGROUND AUDIO PROTECTION
===================================== */

function pauseGalleryAudio() {

    galleryInBackground = true;

    clearTimeout(lightningTimer);

    document.getElementById("lightning").style.opacity = "0";

    if (!audioReady || !audioContext) return;

    try {

        var now =
            audioContext.currentTime;

        masterGain.gain.cancelScheduledValues(now);

        masterGain.gain.setValueAtTime(
            0,
            now
        );

        if (
            audioContext.state === "running"
        ) {
            audioContext.suspend();
        }

    } catch(error) {}
}


function resumeGalleryAudio() {

    if (
        document.hidden ||
        galleryInBackground
    ) {
        return;
    }

    if (!audioReady || !audioContext) return;

    try {

        if (
            audioContext.state === "suspended" &&
            soundEnabled
        ) {
            audioContext.resume();
        }

        applySoundSetting();

    } catch(error) {}
}


function galleryBecameVisible() {

    galleryInBackground = false;

    updateClock();

    startLightning();

    resumeGalleryAudio();
}


/* SAMSUNG APP SWITCH EVENTS */

document.addEventListener(
    "visibilitychange",
    function() {

        if (document.hidden) {

            pauseGalleryAudio();

        } else {

            galleryBecameVisible();

        }
    }
);

window.addEventListener(
    "pagehide",
    pauseGalleryAudio
);

window.addEventListener(
    "pageshow",
    function() {

        if (!document.hidden) {

            galleryBecameVisible();

        }
    }
);

window.addEventListener(
    "blur",
    pauseGalleryAudio
);

window.addEventListener(
    "focus",
    function() {

        if (!document.hidden) {

            galleryBecameVisible();

        }
    }
);


/* =====================================
   LIVE VALLENTUNA WEATHER
===================================== */

function fetchWeather() {

    if (TEST_MODE) {

        setWeather(TEST_WEATHER);

        return;
    }

    var url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + LATITUDE +
        "&longitude=" + LONGITUDE +
        "&current=temperature_2m,precipitation,rain,snowfall,weather_code,wind_speed_10m,wind_gusts_10m" +
        "&timezone=Europe%2FStockholm";

    var xhr =
        new XMLHttpRequest();

    xhr.open(
        "GET",
        url,
        true
    );

    xhr.timeout = 12000;

    xhr.onload = function() {

        if (xhr.status !== 200) {

            weatherInfo.textContent =
                "WEATHER UNAVAILABLE · VALLENTUNA";

            return;
        }

        try {

            var data =
                JSON.parse(xhr.responseText);

            var w =
                data.current;

            var code =
                w.weather_code;

            var rain =
                w.precipitation || 0;

            var snowfall =
                w.snowfall || 0;

            var wind =
                w.wind_speed_10m || 0;

            var gusts =
                w.wind_gusts_10m || 0;

            var type = "clear";

            if (
                [95,96,99].indexOf(code) !== -1
            ) {

                type = "storm";

            } else if (
                [71,73,75,77,85,86].indexOf(code) !== -1 ||
                snowfall > 0
            ) {

                type = (
                    snowfall >= 1.5 ||
                    gusts >= 45 ||
                    wind >= 35 ||
                    [75,86].indexOf(code) !== -1
                )
                    ? "blizzard"
                    : "snow";

            } else if (
                [51,53,55,56,57,61,63,65,66,67,80,81,82].indexOf(code) !== -1 ||
                rain > 0
            ) {

                if (
                    rain >= 7.5 ||
                    [65,67,82].indexOf(code) !== -1
                ) {

                    type = "heavy_rain";

                } else if (
                    rain < 0.5 ||
                    [51,53,56].indexOf(code) !== -1
                ) {

                    type = "drizzle";

                } else {

                    type = "rain";

                }

            } else if (
                [45,48].indexOf(code) !== -1
            ) {

                type = "fog";

            } else if (
                [2,3].indexOf(code) !== -1
            ) {

                type = "cloudy";

            } else if (
                [0,1].indexOf(code) !== -1
            ) {

                var hour =
                    new Date().getHours();

                type = (
                    hour >= 7 &&
                    hour < 19
                )
                    ? "sunny"
                    : "clear";

            }

            setWeather(
                type,
                w.temperature_2m
            );

        } catch(error) {

            weatherInfo.textContent =
                "WEATHER DATA ERROR · VALLENTUNA";

        }
    };

    xhr.onerror = function() {

        weatherInfo.textContent =
            "WEATHER UNAVAILABLE · VALLENTUNA";

    };

    xhr.ontimeout = function() {

        weatherInfo.textContent =
            "WEATHER TIMEOUT · VALLENTUNA";

    };

    xhr.send();
}


/* =====================================
   FULLSCREEN
===================================== */

function enterFullscreen() {

    var page =
        document.documentElement;

    try {

        if (
            document.fullscreenElement ||
            document.webkitFullscreenElement
        ) {
            return;
        }

        if (page.requestFullscreen) {

            var result =
                page.requestFullscreen();

            if (
                result &&
                result.catch
            ) {

                result.catch(function(){});

            }

        } else if (
            page.webkitRequestFullscreen
        ) {

            page.webkitRequestFullscreen();

        }

    } catch(error) {}
}


/* =====================================
   CLICK SCREEN TO TOGGLE SOUND
===================================== */

function activateExperience() {

    enterFullscreen();

    /*
       First click: ON -> OFF
       Second click: OFF -> ON
       Third click: ON -> OFF
    */

    soundEnabled = !soundEnabled;

    galleryInBackground = false;

    if (soundEnabled) {

        if (!audioReady) {

            initializeWeatherAudio();

        } else {

            resumeGalleryAudio();

        }

    } else {

        applySoundSetting();

        if (
            audioReady &&
            audioContext &&
            audioContext.state === "running"
        ) {

            audioContext.suspend();

        }
    }

    startGreeting();

    applySoundSetting();
}

/*
   Only use click here.

   Adding touchstart as well could trigger
   two toggles from one interaction.
*/

document.addEventListener(
    "click",
    activateExperience
);


/* =====================================
   TV WAKE-UP DETECTOR
===================================== */

var lastHeartbeat = Date.now();

var lastWakeReload = Date.now();

function checkForWakeUp() {

    var now =
        Date.now();

    var elapsed =
        now - lastHeartbeat;

    lastHeartbeat = now;

    if (
        elapsed > wakeThreshold &&
        !document.hidden &&
        !galleryInBackground &&
        now - lastWakeReload > wakeThreshold
    ) {

        lastWakeReload = now;

        pauseGalleryAudio();

        window.location.reload();

    }
}

setInterval(
    checkForWakeUp,
    5000
);


/* =====================================
   INITIALISE
===================================== */

resizeCanvas();

fetchWeather();

setInterval(
    fetchWeather,
    weatherRefresh
);

if (ctx) {

    animateWeather();

}

/* Automatically welcome on page load */

startGreeting();

</script>
