
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My TV Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

/* GENERAL */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* PHOTO SLIDESHOW */

.slide {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;

    opacity: 0;

    transition: opacity 2s ease-in-out;
}

.slide.active {
    opacity: 1;
}

/* DARK OVERLAY FOR READABILITY */

.overlay {
    position: absolute;
    inset: 0;

    background: rgba(0,0,0,0.25);

    z-index: 5;
    pointer-events: none;
}

/* CLOCK CONTAINER */

#clockContainer {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 90%;

    text-align: center;

    color: white;

    z-index: 10;

    pointer-events: none;

    text-shadow: 0 4px 25px rgba(0,0,0,0.8);
}

/* CURSIVE CLOCK */

#fancyClock {
    font-family: 'Great Vibes', cursive;

    font-size: clamp(100px, 15vw, 220px);

    font-weight: normal;

    line-height: 1.3;
}

/* DECORATIVE DIVIDER */

.clockDivider {
    width: 100px;
    height: 1px;

    background: rgba(255,255,255,0.85);

    margin: 0 auto 25px auto;
}

/* DATE */

#currentDate {
    font-family: 'Montserrat', sans-serif;

    font-size: clamp(15px, 2vw, 27px);

    font-weight: 300;

    letter-spacing: 4px;

    text-transform: uppercase;
}

/* SMALL BOTTOM LABEL */

#bottomLabel {
    position: absolute;

    bottom: 30px;

    left: 50%;

    transform: translateX(-50%);

    font-family: 'Montserrat', sans-serif;

    font-size: 11px;

    letter-spacing: 5px;

    color: rgba(255,255,255,0.65);

    z-index: 10;
}

</style>
</head>

<body>

<!-- PHOTO LAYERS -->

<div id="slide1" class="slide active"></div>
<div id="slide2" class="slide"></div>

<!-- DARK OVERLAY -->

<div class="overlay"></div>

<!-- CLOCK -->

<div id="clockContainer">

    <div id="fancyClock">00:00</div>

    <div class="clockDivider"></div>

    <div id="currentDate">Loading...</div>

</div>

<!-- BOTTOM LABEL -->

<div id="bottomLabel">HOME</div>

<script>

/* ==================================
   YOUR PHOTOS
================================== */

const photos = [

    "photos/photo1.jpg",
    "photos/photo2.jpg",
    "photos/photo3.jpg"

];

/* ==================================
   SETTINGS
================================== */

// Time between photos
const slideDuration = 15000;

// Random order?
const shuffle = false;

// Clock visibility
const showClock = true;

// Dark overlay strength (0 to 1)
const overlayStrength = 0.25;

/* ==================================
   SLIDESHOW
================================== */

let photoIndex = 0;
let activeSlide = 0;

const slides = [
    document.getElementById("slide1"),
    document.getElementById("slide2")
];

if (shuffle) {
    photos.sort(() => Math.random() - 0.5);
}

// Load first photo
slides[0].style.backgroundImage =
    `url("${photos[0]}")`;

function nextPhoto() {

    if (photos.length < 2) return;

    photoIndex = (photoIndex + 1) % photos.length;

    const nextSlide = 1 - activeSlide;

    const image = new Image();

    image.onload = function() {

        slides[nextSlide].style.backgroundImage =
            `url("${photos[photoIndex]}")`;

        slides[nextSlide].classList.add("active");

        slides[activeSlide].classList.remove("active");

        activeSlide = nextSlide;
    };

    image.src = photos[photoIndex];
}

// Automatic slideshow
if (photos.length > 1) {
    setInterval(nextPhoto, slideDuration);
}

/* ==================================
   CLOCK & DATE
================================== */

function updateClock() {

    const now = new Date();

    // Time (24-hour format)
    const time = now.toLocaleTimeString("sv-SE", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });

    // Date
    const date = now.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("fancyClock").textContent = time;

    document.getElementById("currentDate").textContent = date;
}

if (showClock) {

    updateClock();

    setInterval(updateClock, 1000);

} else {

    document.getElementById("clockContainer").style.display = "none";

}

/* ==================================
   OVERLAY
================================== */

document.querySelector(".overlay").style.background =
    `rgba(0,0,0,${overlayStrength})`;

/* ==================================
   FULLSCREEN REQUEST
================================== */

function enterFullscreen() {

    const page = document.documentElement;

    if (page.requestFullscreen) {
        const result = page.requestFullscreen();
        if (result && result.catch) result.catch(() => {});
    }

    else if (page.webkitRequestFullscreen) {
        page.webkitRequestFullscreen();
    }
}

document.addEventListener("click", enterFullscreen);
document.addEventListener("keydown", enterFullscreen);

</script>

</body>
</html>
