
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My TV Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: black;
}

/* PHOTOS */

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;

    opacity: 0;
    transition: opacity 2s ease-in-out;
}

.slide.active {
    opacity: 1;
}

/* DARK OVERLAY */

.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: 5;
    pointer-events: none;
}

/* ANIMATED RAIN */

#rainCanvas {
    position: absolute;
    inset: 0;

    width: 100%;
    height: 100%;

    z-index: 6;
    pointer-events: none;
}

/* CLOCK */

#clockContainer {
    position: absolute;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    width: 90%;
    text-align: center;
    color: white;

    z-index: 10;
    pointer-events: none;

    text-shadow: 0 4px 25px rgba(0,0,0,0.8);
}

/* CURSIVE TIME */

#fancyClock {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(100px, 15vw, 220px);
    font-weight: normal;
    line-height: 1.3;
}

/* DIVIDER */

.clockDivider {
    width: 100px;
    height: 1px;
    background: rgba(255,255,255,0.85);
    margin: 0 auto 25px auto;
}

/* DATE */

#currentDate {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(15px, 2vw, 27px);
    font-weight: 300;
    letter-spacing: 4px;
    text-transform: uppercase;
}

/* BOTTOM LABEL */

#bottomLabel {
    position: absolute;
    bottom: 30px;
    left: 50%;

    transform: translateX(-50%);

    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: rgba(255,255,255,0.65);

    z-index: 10;
}

</style>
</head>

<body>

<!-- PHOTO SLIDESHOW -->

<div id="slide1" class="slide active"></div>
<div id="slide2" class="slide"></div>

<!-- DARK OVERLAY -->

<div class="overlay"></div>

<!-- RAIN EFFECT -->

<canvas id="rainCanvas"></canvas>

<!-- CLOCK -->

<div id="clockContainer">

    <div id="fancyClock">00:00</div>

    <div class="clockDivider"></div>

    <div id="currentDate">Loading...</div>

</div>

<div id="bottomLabel">HOME</div>

<script>

/* ==================================
   YOUR PHOTOS
================================== */

const photos = [
    "photos/photo1.jpg",
    "photos/photo2.jpg",
    "photos/photo3.jpg"
];

/* ==================================
   SETTINGS
================================== */

const slideDuration = 15000;
const shuffle = false;
const showClock = true;
const overlayStrength = 0.25;

// RAIN SETTINGS

const enableRain = true;

// Number of raindrops
const rainAmount = 130;

// Falling speed multiplier
const rainSpeed = 1.0;

// Rain transparency
const rainOpacity = 0.45;

// Wind direction
const wind = -0.6;

/* ==================================
   PHOTO SLIDESHOW
================================== */

let photoIndex = 0;
let activeSlide = 0;

const slides = [
    document.getElementById("slide1"),
    document.getElementById("slide2")
];

if (shuffle) {
    photos.sort(() => Math.random() - 0.5);
}

if (photos.length) {
    slides[0].style.backgroundImage =
        `url("${photos[0]}")`;
}

function nextPhoto() {

    if (photos.length < 2) return;

    photoIndex = (photoIndex + 1) % photos.length;

    const nextSlide = 1 - activeSlide;

    const image = new Image();

    image.onload = function() {

        slides[nextSlide].style.backgroundImage =
            `url("${photos[photoIndex]}")`;

        slides[nextSlide].classList.add("active");

        slides[activeSlide].classList.remove("active");

        activeSlide = nextSlide;
    };

    image.onerror = function() {
        console.warn("Could not load photo:", image.src);
    };

    image.src = photos[photoIndex];
}

if (photos.length > 1) {
    setInterval(nextPhoto, slideDuration);
}

/* ==================================
   CLOCK AND DATE
================================== */

function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString("sv-SE", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
    });

    const date = now.toLocaleDateString("en-GB", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });

    document.getElementById("fancyClock").textContent = time;

    document.getElementById("currentDate").textContent = date;
}

if (showClock) {
    updateClock();
    setInterval(updateClock, 1000);
} else {
    document.getElementById("clockContainer").style.display = "none";
}

/* ==================================
   OVERLAY
================================== */

document.querySelector(".overlay").style.background =
    `rgba(0,0,0,${overlayStrength})`;

/* ==================================
   ANIMATED RAIN ENGINE
================================== */

const canvas = document.getElementById("rainCanvas");
const ctx = canvas.getContext("2d");

let drops = [];
let width;
let height;

function resizeRain() {

    width = window.innerWidth;
    height = window.innerHeight;

    // Limit rendering resolution for TV performance
    const scale = Math.min(window.devicePixelRatio || 1, 1.5);

    canvas.width = width * scale;
    canvas.height = height * scale;

    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    createRain();
}

function createDrop(randomY = false) {

    return {
        x: Math.random() * width,
        y: randomY ? Math.random() * height : -30,

        length: 8 + Math.random() * 22,

        speed: (3 + Math.random() * 7) * rainSpeed,

        thickness: 0.4 + Math.random() * 1.1,

        opacity: (0.15 + Math.random() * 0.5) * rainOpacity
    };
}

function createRain() {

    drops = [];

    for (let i = 0; i < rainAmount; i++) {
        drops.push(createDrop(true));
    }
}

function animateRain() {

    ctx.clearRect(0, 0, width, height);

    for (let i = 0; i < drops.length; i++) {

        let drop = drops[i];

        ctx.beginPath();

        ctx.strokeStyle =
            `rgba(210,230,255,${drop.opacity})`;

        ctx.lineWidth = drop.thickness;

        ctx.moveTo(drop.x, drop.y);

        ctx.lineTo(
            drop.x + wind * drop.length,
            drop.y + drop.length
        );

        ctx.stroke();

        // Move the raindrop
        drop.y += drop.speed;
        drop.x += wind * drop.speed;

        // Reset after leaving the screen
        if (
            drop.y > height + 30 ||
            drop.x < -40 ||
            drop.x > width + 40
        ) {
            drops[i] = createDrop();
        }
    }

    requestAnimationFrame(animateRain);
}

if (enableRain && ctx) {

    resizeRain();

    window.addEventListener("resize", resizeRain);

    animateRain();

} else {

    canvas.style.display = "none";

}

/* ==================================
   FULLSCREEN REQUEST
================================== */

function enterFullscreen() {

    const page = document.documentElement;

    if (page.requestFullscreen) {

        const result = page.requestFullscreen();

        if (result && result.catch) {
            result.catch(() => {});
        }

    } else if (page.webkitRequestFullscreen) {

        page.webkitRequestFullscreen();

    }
}

document.addEventListener("click", enterFullscreen);
document.addEventListener("keydown", enterFullscreen);

</script>

</body>
</html>
