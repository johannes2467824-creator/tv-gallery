
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My TV Gallery</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
}

/* Photo layers */

.slide {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;

    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;

    opacity: 0;
    transition: opacity 2s ease-in-out;
}

.slide.active {
    opacity: 1;
}

/* Optional clock */

#clock {
    position: absolute;
    bottom: 35px;
    right: 45px;

    color: white;
    font-size: 28px;
    font-weight: 300;

    text-shadow: 0 2px 10px #000;
    z-index: 10;
    display: none;
}

</style>
</head>

<body>
<script>
function enterFullscreen() {
    const page = document.documentElement;

    if (page.requestFullscreen) {
        page.requestFullscreen().catch(() => {});
    } else if (page.webkitRequestFullscreen) {
        page.webkitRequestFullscreen();
    }
}

document.addEventListener("click", enterFullscreen);
document.addEventListener("keydown", enterFullscreen);
</script>

<div id="slide1" class="slide active"></div>
<div id="slide2" class="slide"></div>

<div id="clock"></div>

<script>

/* =========================
   YOUR PHOTOS
========================= */

const photos = [
    "photos/photo1.jpg",
    "photos/photo2.jpg",
    "photos/photo3.jpg"
];

/* =========================
   SETTINGS
========================= */

// Time between photos (milliseconds)
const slideDuration = 15000;

// Show clock?
const showClock = true;

// Random photo order?
const shuffle = false;

/* =========================
   SLIDESHOW
========================= */

let photoIndex = 0;
let activeSlide = 0;

const slides = [
    document.getElementById("slide1"),
    document.getElementById("slide2")
];

if (shuffle) {
    photos.sort(() => Math.random() - 0.5);
}

// First photo
slides[0].style.backgroundImage =
    `url("${photos[0]}")`;

function nextPhoto() {

    photoIndex = (photoIndex + 1) % photos.length;

    const nextSlide = 1 - activeSlide;

    const image = new Image();

    image.onload = function() {

        slides[nextSlide].style.backgroundImage =
            `url("${photos[photoIndex]}")`;

        slides[nextSlide].classList.add("active");
        slides[activeSlide].classList.remove("active");

        activeSlide = nextSlide;
    };

    image.src = photos[photoIndex];
}

// Start slideshow
if (photos.length > 1) {
    setInterval(nextPhoto, slideDuration);
}

/* =========================
   CLOCK
========================= */

if (showClock) {

    const clock = document.getElementById("clock");
    clock.style.display = "block";

    function updateClock() {

        const now = new Date();

        clock.textContent =
            now.toLocaleTimeString("sv-SE", {
                hour: "2-digit",
                minute: "2-digit"
            });
    }

    updateClock();
    setInterval(updateClock, 1000);
}

</script>

</body>
</html>
